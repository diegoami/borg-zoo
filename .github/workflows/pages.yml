name: pages

# Builds the statistics site from the `results` branch and publishes it.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Resume paired saved incidents, Saved suite run]
    types: [completed]
  push:
    branches: [main]
    paths: ['zoo/**', 'catalogue/**', '.github/workflows/pages.yml']
  # RULES 19 (owner, 2026-11-19): the site is rebuilt at least hourly, so its
  # pages (e.g. settings/changes.html) are never more than about an hour behind
  # the results branch and main, even when no run finishes.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue instead of cancelling: compare's collect job dispatches a build for
  # every finished run, so a burst of merges plus dispatches kept cancelling
  # the deploy in flight (2026-11-10: three merges in 20 minutes left the site
  # a merge behind, with the last deploy ending "Deployment cancelled").
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch results
        run: |
          if git fetch origin results 2>/dev/null; then
            git worktree add results-branch origin/results
          else
            mkdir -p results-branch/results
          fi
      - run: python3 -m zoo site --results results-branch/results --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
