name: smoke

# Build-and-play checks of a specimen (a milestone or a head), not experiments.
# Runs a file from smoke/ through the compare workflow, but appends its cells
# to the separate `smoke-results` branch, so nothing reaches the dashboard or
# the experiment tables.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke file
        required: true
        default: smoke/rs-smoke.json
      shards:
        description: Run jobs per specimen
        required: true
        default: '2'

permissions:
  contents: write
  actions: write

jobs:
  smoke:
    uses: ./.github/workflows/compare.yml
    with:
      experiment: ${{ inputs.smoke }}
      shards: ${{ inputs.shards }}
      results_branch: smoke-results
      rebuild_site: false
