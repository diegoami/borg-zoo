name: Prepare saved incident suite
run-name: ${{ inputs.definition }} ${{ inputs.stage }}
on:
  workflow_dispatch:
    inputs:
      definition:
        description: Generated harvest definition
        default: scenario-experiments/suite2-v1-harvest.json
        required: true
      stage:
        type: choice
        options: [smoke, harvest, inspect]
        default: smoke
      smoke_run:
        description: Successful smoke run required before the full harvest
        default: ''
  workflow_call:
    inputs:
      definition:
        type: string
        default: scenario-experiments/balanced999-incidents-harvest.json
      stage:
        type: string
        default: harvest
      smoke_run:
        type: string
        default: ''
      arm:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: incident-harvest-${{ inputs.definition }}-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  pins:
    runs-on: ubuntu-24.04
    outputs:
      cemetery: ${{ steps.pins.outputs.cemetery }}
      spec: ${{ steps.pins.outputs.spec }}
      spec_sha256: ${{ steps.pins.outputs.spec_sha256 }}
      suite_id: ${{ steps.pins.outputs.suite_id }}
      source: ${{ steps.pins.outputs.source }}
      tools: ${{ steps.pins.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate definition and explicit full-bank request
        env: {ARM: '${{ inputs.arm }}', DEFINITION: '${{ inputs.definition }}', STAGE: '${{ inputs.stage }}', SMOKE_RUN: '${{ inputs.smoke_run }}', GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          assert os.environ['ARM']==''
          path=Path(os.environ['DEFINITION'])
          assert path.parent==Path('scenario-experiments') and path.suffix=='.json'
          d=json.load(open(path))
          subprocess.run(['python3','-m','zoo','define','--check',d['definition']],check=True)
          if 'suite_id' in d and os.environ['STAGE']=='harvest':
              run=os.environ['SMOKE_RUN'];assert re.fullmatch('[0-9]+',run)
              previous=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}']))
              assert previous['conclusion']=='success' and previous['head_sha']==os.environ['GITHUB_SHA'] and previous['path']=='.github/workflows/harvest-incidents.yml'
              assert previous['display_title']==str(path)+' smoke'
          assert d['expected_cells']==999 and d['per_class']==111 and d['classes']==list(range(9))
          PY
      - id: pins
        env: {DEFINITION: '${{ inputs.definition }}'}
        run: |
          python3 - <<'PY'
          import json,os,re
          d=json.load(open(os.environ['DEFINITION']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('spec='+d['cemetery']['spec']+'\nspec_sha256='+d['cemetery']['spec_sha256']+'\nsuite_id='+d.get('suite_id','balanced-999-incidents')+'\n')
              for name,key in [('cemetery','cemetery'),('source','preparation_source'),('tools','native_tools')]:
                  pin=d[key]['commit'];assert re.fullmatch('[0-9a-f]{40}',pin);f.write(name+'='+pin+'\n')
          PY
  build:
    if: inputs.stage != 'inspect'
    needs: pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BORG_CEMETERY_DIR: ${{ github.workspace }}/native-tools
    steps:
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-reborn-rs, ref: '${{ needs.pins.outputs.source }}', path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-cemetery, ref: '${{ needs.pins.outputs.tools }}', path: native-tools, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake libssl-dev
      - name: Build preparation source once
        working-directory: source
        run: BORG_IMPL=rust flock /tmp/angband-validation.lock harness/build.sh
      - run: tar -C source -czf preparation-build.tgz build/rust/game/angband build/rust/game/lib build/rust/BUILD_ID
      - uses: actions/upload-artifact@v4
        with: {name: incident-preparation-build, path: preparation-build.tgz, retention-days: 90}
  harvest:
    needs: [pins, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        class: [0,1,2,3,4,5,6,7,8]
    env:
      PYTHONUNBUFFERED: '1'
      BORG_CEMETERY_DIR: ${{ github.workspace }}/native-tools
    steps:
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-cemetery, ref: '${{ needs.pins.outputs.cemetery }}', path: cemetery, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-reborn-rs, ref: '${{ needs.pins.outputs.source }}', path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-cemetery, ref: '${{ needs.pins.outputs.tools }}', path: native-tools, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: incident-preparation-build}
      - run: tar -C source -xzf preparation-build.tgz
      - name: Verify frozen preparation manifest
        env: {SPEC: '${{ needs.pins.outputs.spec }}', SPEC_SHA256: '${{ needs.pins.outputs.spec_sha256 }}'}
        run: |
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('cemetery',os.environ['SPEC']).read_bytes()).hexdigest()==os.environ['SPEC_SHA256']
          PY
      - name: Harvest and inspect incidents for this class
        id: harvest
        env: {CLASS_INDEX: '${{ matrix.class }}', STAGE: '${{ inputs.stage }}'}
        run: >-
          python3 cemetery/scripts/harvest_incidents.py
          --spec "cemetery/${{ needs.pins.outputs.spec }}"
          --source source --tools native-tools --out harvest --class-index "$CLASS_INDEX"
          ${{ inputs.stage == 'smoke' && '--smoke' || '' }}
      - name: Pack lean frozen selection for assembly
        if: steps.harvest.outcome == 'success'
        run: python3 cemetery/scripts/pack_incident_selection.py --harvest harvest --out selection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-selection-${{ matrix.class }}
          path: selection/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve complete preparation evidence in a compressed archive
        if: always()
        run: |
          if [ -d harvest ]; then tar -czf "harvest-class-${{ matrix.class }}.tgz" harvest; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-raw-${{ matrix.class }}
          path: harvest-class-*.tgz
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
  assemble:
    needs: [pins, harvest]
    if: always() && needs.pins.result == 'success' && inputs.stage != 'inspect'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-cemetery, ref: '${{ needs.pins.outputs.cemetery }}', path: cemetery, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-cemetery, ref: '${{ needs.pins.outputs.tools }}', path: native-tools, persist-credentials: false}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: incident-selection-*, path: inputs}
      - uses: actions/checkout@v4
        with: {repository: diegoami/borg-reborn-rs, ref: '${{ needs.pins.outputs.source }}', path: source, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: incident-preparation-build}
      - run: tar -C source -xzf preparation-build.tgz
      - name: Refuse a short or unbalanced bank
        run: >-
          python3 cemetery/scripts/materialize_incidents.py --inputs inputs
          --out "cemetery/synthetic/${{ needs.pins.outputs.suite_id }}/generated" --tools native-tools
          --baseline "${{ needs.pins.outputs.source }}"
          --per-class ${{ inputs.stage == 'smoke' && '2' || '111' }}
          --suite-id "${{ needs.pins.outputs.suite_id }}"
      - name: Validate all999 inputs and class balance
        env: {SUITE_ID: '${{ needs.pins.outputs.suite_id }}', STAGE: '${{ inputs.stage }}'}
        run: |
          python3 - <<'PY'
          import sys,json,os
          from pathlib import Path
          sys.path.insert(0,'cemetery/scripts')
          from encounter_bank import prepare_bank
          root=Path('cemetery').resolve();p=root/'synthetic'/os.environ['SUITE_ID']/'generated/bank.json'
          bank,shards=prepare_bank(p,root)
          assert bank['expected_cases']==(18 if os.environ['STAGE']=='smoke' else 999)
          c=json.load(open(p.parent/'coverage.json'));assert set(c['class_counts'].values())=={2 if os.environ['STAGE']=='smoke' else 111}
          PY
      - name: Mixed-class native restart smoke on the assembled bank
        if: needs.pins.outputs.suite_id != 'balanced-999-incidents'
        env: {SUITE_ID: '${{ needs.pins.outputs.suite_id }}', SOURCE_SHA: '${{ needs.pins.outputs.source }}'}
        run: |
          python3 - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'cemetery/scripts')
          from single_encounter import execute
          root=Path('cemetery').resolve();generated=root/'synthetic'/os.environ['SUITE_ID']/'generated'
          bank=json.loads((generated/'bank.json').read_text());rows=[]
          for shard in bank['shards'][:3]:
              path=root/shard['manifest'];manifest=json.loads(path.read_text())
              for case in manifest['scenarios']:
                  if len(rows)==18:break
                  out=Path('restart-smoke',case['id']).resolve()
                  rc=execute(path,case['id'],Path('source').resolve(),os.environ['SOURCE_SHA'],'borg-rs',Path('native-tools').resolve(),out,root/'synthetic'/os.environ['SUITE_ID']/'borg.txt')
                  receipt=json.loads((out/'single-encounter.json').read_text())
                  rows.append(dict(id=case['id'],status=receipt['status'],returncode=rc))
                  Path('restart-smoke/summary.json').write_text(json.dumps(rows,indent=2)+'\n')
                  assert rc==0 and receipt['status'] in ('death','survived_horizon'),rows[-1]
          assert len(rows)==18
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: restart-smoke, path: restart-smoke/, retention-days: 90, if-no-files-found: warn}
      - run: tar -C cemetery -czf prepared-bank.tgz "synthetic/${{ needs.pins.outputs.suite_id }}/generated"
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: '${{ needs.pins.outputs.suite_id }}-${{ inputs.stage }}-bank', path: prepared-bank.tgz, retention-days: 90}

  inspect:
    if: inputs.stage == 'inspect'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: incident-raw-1, run-id: '${{ inputs.smoke_run }}', github-token: '${{ github.token }}', path: evidence}
      - run: |
          python3 - <<'PYCODE'
          import json,tarfile
          from pathlib import Path
          from collections import Counter
          with tarfile.open(next(Path('evidence').glob('*.tgz'))) as t:
              d=json.load(t.extractfile('harvest/harvest.json'))
              print('Attempt outcomes:',Counter((r['status'],r.get('reason')) for r in d['attempts']))
              print('First attempt:',json.dumps(d['attempts'][0],indent=2))
              for n in t.getnames():
                  if n.endswith('/selection.json'):
                      print(n,t.extractfile(n).read().decode()[:3000]);break
          PYCODE
