prespecified: |
  Fixed 2026-11-22 after the pilot gate (run 45023921364: arms play differently (0-1 of 18 identical), 1-3 deaths per arm) and before any result of this tier was read. Small tier (RULES 14) on the same build:
  classes-1800 starts 1-90 (90 starts per arm, paired), all classes, 100,000 turns, one binary, disjoint from the other tiers of the study (pool them
  as one study, RULES 14). All six profiles (ctl, m1, m2 in breeders-x4 and in breeders-x8); a world's arms are compared only within that world.
  Gate: no config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts reported start by start.
