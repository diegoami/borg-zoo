  gold spent per category per game (healing, escape, oil, ammunition, armour, weapons, diggers, unknown kinds) from the
  town records where kept, else from 'You bought' messages in replays; healing potions carried at death; Shovels
  bought, and rubble dug with and without a digger. Paired against ctl on the same start: rescued, newly killed,
  identical play. 18 starts per arm cannot show which setup is better.
