# borg-zoo#408: crows (and wild cats) scary for fragile classes at CL1-2 only, pilot; owner 2026-11-19.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-crow-pilot.yaml
#
# Each arm appends lines to main's scary list. "crow | 0-2": tough classes never fear it, Mage and Necromancer up to
# CL2, the others in between (fragility).
name: reborn-crow-pilot
issue: 408
question: >-
  On borg-reborn-rs main 3ba17e2c, does making crows (and wild cats), the top early killers, scary for the fragile
  classes up to CL2 or CL3 save the low-level deaths without costing progress?
tier: pilot            # classes-18: 9 classes x 2 seeds, 100,000 turns

specimen: 4.2.6-reborn-rust-main-3ba17e2c
settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none

profile_prefix: reborn-crow38
arms:
  ctl: {}   # shipped
  crow2: {borg_scary_list_lines: ["crow | 0-2"]}
  crow3: {borg_scary_list_lines: ["crow | 0-3"]}
  crowcat2: {borg_scary_list_lines: ["crow | 0-2", "wild cat | 0-2"]}
control: [ctl]
owner_authorization: >-
  2026-11-19: the owner asked for the crow pilot after the death profile of shipped main (crows 21 of 105 deaths over
  1,800 starts, 62% of deaths at CL1-2). Pilot first (RULES 16).
extra:
  retain_evidence: true

prespecified: |
  Fixed 2026-11-19, before any result was read. Pilot (RULES 16). #241 (156c8e52, five early killers at 2-4) is
  context only.
  Gate:
  - no config_error; one binary; each arm's appended lines in the run's scary list;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Report per arm and per class: identical plays against ctl; deaths and causes (deaths to crows and wild cats named),
  CL1-3 deaths, final level, deepest level; paired rescued and newly killed; "Scary guy on level" notes naming a crow
  or wild cat. Each arm is reported as harmful, neutral (safe to adopt) or helpful (RULES 18). Direction only.
