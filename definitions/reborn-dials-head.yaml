prespecified: |
  Fixed 2026-11-24, before any result (Rule 22, #758). Pilot classes-18, 100,000 turns, one dial per arm against ctl, shipped values otherwise, evidence not retained. Out of scope: caution_walk_away_immobile 0 (owner: NEVER, the index row), on/off switches already measured by their studies, and the #1149 dear-row percents (untouched until #745's re-pin read lands). Gate: no config_error; one binary; each arm's value in params-core.json; every cell ends in death, turn_cap or borg_stopped; identical plays per arm. Progress endpoint CL5 reached by 100,000 turns - known attainment out of all starts, deaths, unfinished and alive at the cutoff with CL5 reported separately; DL3/DL5 and level arrival as diagnostics. Report per arm against ctl: the CL5 endpoint, deaths and causes, paired CL5 and deaths (exact McNemar over pairs known in both arms), identical plays. A dial that plays ctl's keys was not exercised and gets no ladder. Exercised dials go to ladders one at a time on the owner's word (RULES 14). Descriptive.
