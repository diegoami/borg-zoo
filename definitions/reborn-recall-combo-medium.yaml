prespecified: |
  Medium tier (owner, 2026-11-18) of the six stairs-first arms, after the pilot (run 44355657179: every
  Recall-first arm lost the same Blackguard, every stairs-first arm kept it).
  Fixed 2026-11-18, before any zoo result was read (owner request). Pilot (RULES 16); larger tiers only after this
  gate and the owner. Full 3x2x2 factorial; ctl is the shipped configuration.
