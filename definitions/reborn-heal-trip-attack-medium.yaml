owner_authorization: >-
  2026-11-17: after the small tier's gate passed (run 43977574813: bundle no plan 5/90 deaths, with
  errands_plan 4/90), the owner asked for the medium tier of the same arms plus the ambitious plan.
  No neutral control: the bundle is about to become the default, and the owner holds the earlier
  controls (RULES 8 still limits what the report may claim).

prespecified: |
  Fixed 2026-11-17, before any result was read (borg-zoo#164). Medium tier only (RULES 14: starts
  91-360, disjoint from the small tier; analysed together with it on all 360 starts, the small tier
  having only the no-plan and errands_plan arms). The question is whether either plan helps the
  bundle; it says nothing about the bundle against the neutral build. Gate: no config_error; one
  binary; every bundle setting applied from borg.txt (params-core.json) in all arms; the loaded plan
  copy matches its pin in the plan arms and is absent from the no-plan arm. Every cell ends in death,
  turn_cap or borg_stopped; frozen-turn stalls and key outliers are listed. Report per arm and per
  class: deaths, final level, deepest level, keys; paired rescued and newly killed for each plan arm
  against the no-plan arm on the same start, and the cells where play diverges.
