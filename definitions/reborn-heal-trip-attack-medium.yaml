# and errands_plan_ambitious.txt, medium tier. Write the catalogue entries with:
#   python3 -m zoo define definitions/reborn-heal-trip-attack-medium.yaml
name: reborn-heal-trip-attack-medium
issue: 164
question: Does either errands plan help the heal + trip policy + attack preference bundle?
