prespecified: |
  Fixed 2026-11-21, before any result was read. Release measurement of borg-reborn-rs v0.1.0-alpha.1 (S0) at ed52fec1: one arm (shipped, no overrides), classes-1800, 100,000 turns, ladder verysmall (45, pilot), small-rest (45), medium (270), big (540), full (900) = 1,800 starts. Descriptive: the release notes state these numbers and make no claim with them (RULES 14).
  Gate: no config_error; one binary (BUILD_ID source_sha256, binary_sha256, borg_txt_sha256 reported); every cell ends in death, turn_cap or borg_stopped; stalls, timeouts and harness failures counted apart from deaths and survivors.
  Report, overall and per class: deaths by the cap (count, share, depth and CL at death, top killers); survivors at the cap (count, mean CL, mean max depth); alive at the cap having reached DL5 (count, share); unfinished games; run id, suite and seed block.
