prespecified: |
  Fixed 2026-11-17, before any result was read (borg-zoo#170). Pilot only (RULES 14); small and larger
  only after this gate and the owner. Gate: no config_error; one binary; every bundle setting and
  attack_speed_fight_danger_tenths = 30 written in the borg.txt and params-core.json of all three arms;
  the loaded plan copy matches its pin in the plan and ambitious arms and is absent from the no-plan
  arm; every cell ends in death, turn_cap or borg_stopped; frozen-turn stalls and key outliers are
  listed. Report per arm: deaths, final level, deepest level, keys; paired rescued and newly killed for
  each plan arm against the no-plan arm on the same start, and the cells where play diverges. The
  plan arm is the same specimen and profile as reborn-speed-fight-pilot's speed30 arm and may be
  compared with it as a repeat. 18 starts per arm cannot show which plan is better.
