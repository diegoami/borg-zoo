owner_authorization: >-
  2026-11-19: the owner asked for definitions of the proposed changes, focused on the weakest classes (#415 study 3).
  Pilot first (RULES 16), then medium, big and full, each after the previous gate (RULES 14). Dispatch is the
  owner's call.
extra:
