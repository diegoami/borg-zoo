prespecified: |
  Fixed 2026-11-19, before any result of these profiles was read. Pilot (RULES 16).
  The control is rule-on, the configuration main is about to ship (borg-reborn-rs#662); rule-off is the Blackguard
  exception. Evidence: Blackguards were the only class worse with the rule, 13 against 18 deaths over #347's two
  studies (6 / 7 on classes-1800 at 4acf071f, 7 / 11 on classes-1800-b at 3ba17e2c).
  Gate:
  - no config_error; one binary; each arm's values in borg.txt and in params-core.json of the death replays;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced;
  - in rule-off, no "# Phase rule" note.
  Report per arm: deaths and causes, CL at death, mean max CL and DL; paired rescued and newly killed (rule-off against
  rule-on); identical plays; Phase Doors done and "# Phase rule" verdicts. RULES 18 bins; 10 starts show direction only.
