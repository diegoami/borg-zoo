arms:
  rule-on: {borg_param_escape_phase_adjacent_rule: 1, borg_param_escape_phase_lost_test: 0, borg_param_escape_phase_lost_danger_percent: 100}
  rule-off: {borg_param_escape_phase_adjacent_rule: 0, borg_param_escape_phase_lost_test: 1, borg_param_escape_phase_lost_danger_percent: 100}
