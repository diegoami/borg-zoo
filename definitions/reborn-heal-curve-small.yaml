  had the pilot run first (reborn-heal-curve-pilot, run 44125061301, gate passed), then asked for small and
  medium together (2026-11-17).

prespecified: |
  Fixed 2026-11-17, before any result was read (borg-zoo#192). Small tier, dispatched together with the medium
  tier on the owner's request; the pilot (run 44125061301) came first (RULES 16). The curve scale stretches the town planner's diminishing healing curve: weight and
  demand scale together, so the first HP keeps its value and the half-value point moves to the scale's
  percent of today's (50 = stops buying healing sooner, 200 = keeps buying). Gate: no config_error; one
  binary; the three borg_param_town_heal_* lines with the arm's values (reserve 0/200/400, curve
  50/100/200, speed 66) in every arm's borg.txt and in params-core.json of the death replays; no plan
  loaded; every cell ends in death, turn_cap or borg_stopped; frozen-turn stalls and key outliers listed;
  death bundles reproduced. Consistency check: r0-c100, r200-c100 and r400-c100 are the arms r0, r200 and
  r400 of reborn-heal-reserve-s66-small (same specimen, same starts, same values) and should reproduce
  their key hashes; any difference is reported before anything else. Report per arm: deaths, final level,
  deepest level, keys; deaths by class, with low-max-HP casters (Mage, Necromancer) called out; paired
  rescued and newly killed against r0-c100 on the same start, with an exact McNemar p; per reserve, the
