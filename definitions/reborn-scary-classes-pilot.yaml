prespecified: |
  Fixed 2026-11-18, before any result of these arms was read. Pilot (RULES 16). #292's pilot (same specimen, run
  44317648896) is context: no list 6 deaths against 0 for the shipped list.
  Gate:
  - no config_error; one binary; each arm's appended lines in the run's scary list (hash recorded per cell);
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class, not pooled:
  - identical plays against ctl per class (Warrior, Paladin and Blackguard are expected identical in up3 and up6);
  - deaths and causes, final level, deepest level; paired rescued and newly killed against ctl;
  - per game "Scary guy on level" notes with the monster and character level, flights, and time spent on DL1.
  Two starts per class per arm show only where the spread acts; per-class direction needs the next tiers.
