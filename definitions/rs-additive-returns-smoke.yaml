folder: smoke
description: |-
  54 native functional/timing checks: six configurations across all nine classes on merged PR88/M13. 100000 turns per game; diagnostic only.
prespecified: |-
  Wiring and timing only. Inspect all 54 endpoints, native settings, actual class/race and source/binary identity. Natural deaths are normal endpoints, not wiring failures. Report every abnormal outcome. Check policy-off shopping and (0,0) key equality when no additional return request changes play. No performance inference or candidate selection from these nine starts. Full experiment is not dispatched until these checks complete successfully.
owner_authorization: |-
  2026-11-15 owner requested repeating the experiment after PR88 merged, in particular the last four threshold rows. Keep both same-build controls to interpret the added return triggers. Existing repository runner rule: wait for account idle, then use bounded shards with at most 20 game jobs and one game process per job.
