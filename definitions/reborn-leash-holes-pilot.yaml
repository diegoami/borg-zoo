  Fixed 2026-11-23, before any result of this build was read (borg-zoo#719; borg-reborn-rs #1062, PR #1087). Five arms on track-p 0dbe9843 + #1087 (449be363; every #1062 switch ships 0, so ctl is the shipped play): ctl; any (flow_leash_any_stair 1); unknown (flow_leash_unknown_stair_steps 20); recall (flow_leash_teleported_recall 1); leash3 (all three). Pilot: classes-18, 100,000 turns, evidence retained, 90 cells. Gate: no config_error; one binary; each arm's values in params-core.json; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts apart; identical plays per arm (a switch that plays the control's keys in every game was not exercised). Read per arm and class: deaths and causes, deaths at CL <= 2 apart, rescued and newly killed against ctl (exact McNemar); progress: level at 25k, 50k and 100k turns (milestones), starts reaching DL3 and DL5 and their first turn there (first_turn_at_depth) (#646's kit leash lowered DL3 arrivals from 129 to 111 and delayed the median by about 10,000 turns); per game from messages.log the notes '# Looking for stairs. Goal_less, any stair', '# Leash: a N-grid jump left the Borg' and '# Leash: reading Recall after the jump', with their games. Then, on the gate and the owner: verysmall (classes-1800 starts 1-45) paired against ctl. Every value (20, 5, 30) is a hypothesis; descriptive (RULES 14).
