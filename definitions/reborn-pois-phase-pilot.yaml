prespecified: |
  Fixed 2026-11-23, before any result of these arms on random starts was read (borg-zoo#738; borg-reborn-rs#1134). Five arms on track-p 1c071812, classes-18,
  100,000 turns, evidence retained. Mechanism evidence only, from chosen starts (the 25 deaths of run 45121432449, replayed from birth, borg-cemetery#146):
  phase50 rescued 5 at the fatal episode, conf 2, osc 1; none killed any of 18 sampled survivors. Chosen-start rescues did not carry over to fresh starts
  before (#429, #501), so this measures on random starts.
  Gate: no config_error; one binary; each arm's values in params-core.json; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts
  apart; identical plays per arm (an arm that plays the control's keys in most games was not exercised).
  Report per arm and class: deaths and causes (poison apart), CL at death, final and maximum level, deepest level; paired rescued and newly killed against
  ctl (exact McNemar); Phase Door reads, CLW quaffs and Word of Recall reads per game; per game the counts of each switch's notes ("Phase rule ... the rule
  allows a Phase Door", "Fixing Confusion", "(#932)"). Descriptive (RULES 14). Next tier verysmall (classes-1800 starts 1-45) with the arms that are not
  harmful, only on the owner's word.
