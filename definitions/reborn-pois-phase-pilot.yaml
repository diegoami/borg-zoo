  phase50: {borg_param_escape_phase_lost_danger_percent: 50}
  conf: {borg_param_caution_confused_clw_cure: 1}
  osc: {borg_param_caution_retreat_oscillation_limit: 3, borg_param_caution_retreat_oscillation_backaway: 1}
  all: {borg_param_escape_phase_lost_danger_percent: 50, borg_param_caution_confused_clw_cure: 1, borg_param_caution_retreat_oscillation_limit: 3, borg_param_caution_retreat_oscillation_backaway: 1}
