# borg-zoo (owner 2026-11-20, "we need calibrating for prepared_"): the dive gates' thresholds, both directions.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-prepared-calibration-pilot.yaml
#
# prepared_* decides when the Borg may go down: the minimum maximum HP and maximum character level to enter DL2, DL3-4
# and DL5-9 (per class), and the Cure potions to carry from DL3. The pilots so far end at mean max DL 2.2 and CL 6 at
# 100,000 turns, so these are the gates a character meets first. The mid and deep gates (DL10 and deeper) and the depth
# margin are not varied here: #518 sweeps the margin and the mid offsets, and 100,000 turns rarely reach DL10.
# Shipped per-class values (order warrior, mage, druid, priest, necromancer, paladin, rogue, ranger, blackguard):
#   dl34_min_clevel 4 11 9 9 11 4 8 4 4;  dl59_min_clevel 6 15 15 15 15 6 10 6 6;
#   dl34_min_hp 50 60 40 40 60 50 50 50 50;  dl59_min_hp 60 80 60 60 80 60 60 60 60;  dl2_min_hp 30;  cure_min 2.
