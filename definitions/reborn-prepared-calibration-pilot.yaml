prespecified: |
  Fixed 2026-11-20, before any result of this build was read. Pilot (RULES 16); small tiers of arms that lead follow
  after the gate and the owner. Eight arms against ctl, 18 starts each (162 games).
  Gate: no config_error; one binary; each arm's values in params-core.json of the death replays (the per-class lines
  override the shipped ones); ctl plays as main a04e5471's shipped settings; every cell ends in death, turn_cap or
  borg_stopped (stalls, timeouts and crashes kept apart); frozen-turn bursts classified.
  Report per arm and per class: deaths and causes, character level at death, final and maximum level, deepest level;
  paired rescued / newly killed against ctl (exact McNemar), identical plays; turns to first DL2, DL3, DL5; for every
  death the gate that was last passed (depth entered, CL and max HP at entry); how many starts were held at a depth by a
  prepared_ gate and for how long, if the logs show it. A gate that never holds in ctl (identical plays) means "not
  tested". Descriptive (RULES 14).
