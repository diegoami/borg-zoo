# borg-zoo#596: the fast-fragile policy of borg-reborn-rs PR #847 (#842), small tier: ctl, named, named-ban, stats, stats-ban.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-fast-fragile-small.yaml
name: reborn-fast-fragile-small
issue: 596
question: >-
  On borg-reborn-rs 7f8c6b80 (PR #847), does attacking a fast-fragile monster (crow, wild cat, by name or by stats) with the
  best attack every turn, with and without a ban on healing next to it and with the Phase Door or stairs alternative at
  100, 75 or 0 percent, save the early deaths (a crow killed 8 of #566's 29) without adding new ones?
tier: small            # classes-1800 starts 1-90, 100,000 turns

specimen: 4.2.6-reborn-rust-fast-fragile-7f8c6b80

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none

profile_prefix: reborn-fastfrag
arms:
  ctl: {}
  named:      {borg_param_fast_fragile_policy: 1}
  named-ban:  {borg_param_fast_fragile_policy: 1, borg_param_fast_fragile_no_heal: 1}
  stats:      {borg_param_fast_fragile_policy: 1, borg_param_fast_fragile_by_stats: 1}
  stats-ban:  {borg_param_fast_fragile_policy: 1, borg_param_fast_fragile_by_stats: 1, borg_param_fast_fragile_no_heal: 1}
control: [ctl]
owner_authorization: >-
  2026-11-21: borg-reborn-rs owner (#842: "ask for zoo runs ... before the PR merges"), filed as borg-zoo#596, "pilot then
  small + medium"; zoo owner, 2026-11-21: "start all open pilots and followups" (the pilot, run 44926451797, is its gate).
extra:
  retain_evidence: false

prespecified: |
  Fixed 2026-11-21 after the classes-18 pilot (run 44926451797: 0 deaths in all eight arms, 18/18 identical plays for the
  name arms, 17/18 for the stats arms: the arms were mostly not exercised there). Small tier (RULES 14): the five arms the
  owner asked for (ctl, named, named-ban, stats, stats-ban), 90 starts each, classes-1800 starts 1-90, all classes, one
  binary, 100,000 turns. The three variants that added nothing over named in the pilot (esc75, attack-only, ban-exc) are
  dropped.
  Gate: no config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls reported start by start
  (lightless aborts apart); frozen-turn bursts classified.
  Report per arm and class: deaths and causes (crow and wild cat apart), CL at death, final and maximum level; paired
  rescued and newly killed against ctl (exact McNemar), identical plays; the other fast-fragile deaths (cave spiders,
  centipedes, bats); small and medium pooled as one study of 360 starts (RULES 14); a RULES 18 bin. Descriptive.
