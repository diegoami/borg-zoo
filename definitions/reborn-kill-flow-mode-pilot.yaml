prespecified: |
  Fixed 2026-11-19, before any zoo result was read (borg-reborn-rs#691, PR #695). Pilot (RULES 16) on the 200,000-turn
  pilot suite, because the question is CL10 and above; larger tiers only after this gate and the owner. ctl is shipped.
  Gate:
  - no config_error; one binary; each arm's value in borg.txt and in params-core.json of the death replays;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Report per arm and per class, from every game's messages:
  - deaths and causes, final and maximum level, deepest level; paired rescued and newly killed against ctl;
  - "# Flowing toward kill" per game, split by character level band (CL1-9, 10-15, 16-25, 26+);
  - kills per game ("# DIED:" with "(+)") and experience at the end;
  - for every death in any arm: was the Borg walking to a fight (a "Flowing toward kill" in the 20 decisions before it), and
    in which level band; ctl deaths of that kind are the hunt's cost, arm 3's missing kills its value.
