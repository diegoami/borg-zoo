prespecified: |
  Fixed 2026-11-19, before any result of floor3, floor4 or all5-pal was read. Pilot (RULES 16). ctl and all5 repeat
  #350's pilot arms on the same starts and should replay them.
  Gate:
  - no config_error; one binary; each arm's lines in its borg.txt and scary list;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class: identical plays against ctl; deaths and causes (by monster, and CL at death), CL1-4 deaths, final
  level, deepest level; paired rescued and newly killed.
  Each value is reported as harmful, neutral (safe to adopt) or helpful (RULES 18). Direction only.
