name: reborn-patch-x8-pilot
issue: null            # to be filed
question: >-
  In the world where the grey mushroom patch is 8 times as likely (patches-x8), does the kill-on-sight entry for it (#869) cost games
  against the patch's ranged entry it replaced, with and without the confused attack by direction (#867, #901) and the
  CLW confusion cure (#837)?
tier: pilot            # classes-18, 100,000 turns; then verysmall (45 starts) of what leads, after the gate and the owner

specimen:
  name: 4.2.6-reborn-rust-patchworld-e846f9f9
  repository: diegoami/borg-reborn-rs
  ref: e846f9f94f28cd8d142b0b9c34eba1994e7038b4
  label: "borg-reborn-rs e846f9f9 = track-p 9085c266 + make-world `favour` and the patches-x4/x8 worlds (branch claude/zen-pasteur-a10llc, no PR). Shipped harness/borg.txt e4bd2b87..., scary_monsters.txt ff831d0a..., borg-rs core; plays as 9085c266 outside a world."
