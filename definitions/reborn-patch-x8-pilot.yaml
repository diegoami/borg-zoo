# The grey mushroom patch deaths of run 45028029063 (reborn-trackp-9085c266-full: 11 of 28
# deaths, none on f57499d0 or ab775d48), stress-tested in worlds where the patch is 4 and 8 times as likely.
# borg-zoo#665. Write the catalogue entries with:
#   python3 -m zoo define definitions/reborn-patch-x8-pilot.yaml
# Its twin for patches-x4 is a draft (borg-zoo commit 3e7c95e), not defined.
#
# Specimen: borg-reborn-rs f46b4997, head of PR #976 (#969: attack_kill_on_sight_min_hp_percent, shipped 50) stacked on PR #971
# (#970: `favour`/`favour_weight` in scripts/make-world.py, harness/worlds/patches-x4.txt and patches-x8.txt: every race but the
# grey mushroom patch gets its rarity times 4 or 8; depths unchanged), on track-p 4b2c2fcf. Arm floor0 is the play of 9085c266
# at the patch.
#
# Local replays of the 13 deaths at the patch (11 killed by it, 2 by Grip while confused by it) at 9085c266 (borg-reborn-rs
# session notes, 2026-11-22): all 13 reproduce with the shipped settings. With the patch's attack line removed (`ranged`),
# 8 games play the same keys up to the fatal patch and 7 of those 8 live to the cap. There the Borg rated the patch's danger
# (408 against 15 HP), threw oil, drank Cure Light Wounds at HP 7, read Phase Door and recalled. attack_confused_by_direction 0
# alone changed nothing in 11 of 13 (melee is allowed confused either way).
# At f46b4997 (PR #976): floor 0 reproduces all 13; floor 50 leaves 1 (Grip, borg-reborn-rs#974), the 12 patch games diverging inside
# the fatal encounter; floor 33 leaves 2. Named cases show a direction, not an effect (RULES 14).
name: reborn-patch-x8-pilot
issue: 665
question: >-
  In the world where the grey mushroom patch is 8 times as likely (patches-x8), does #969's HP floor (shipped 50) save the games the
  kill-on-sight entry (#869) cost, against no floor, the patch's ranged entry, the confused attack by direction off (#867, #901) and
  the CLW confusion cure (#837)?
tier: pilot            # classes-18, 100,000 turns; then verysmall (45 starts) of what leads, after the gate and the owner

specimen:
  name: 4.2.6-reborn-rust-pr976-f46b4997
  repository: diegoami/borg-reborn-rs
  ref: f46b49976164233acabc3b114f946c1c104254f9
  label: "borg-reborn-rs f46b4997, head of PR #976 (#969: kill-on-sight HP floor, shipped 50) stacked on #971 (#970: make-world favour, patches-x4/x8), on track-p 4b2c2fcf. scary_monsters.txt 5a4ec4b6... (comment change only), borg-rs core."
  scary_lists:
    scary_monsters.txt: 5a4ec4b6221f2487d19bd3146c9c36ed7e3a619b1bf9d14dbd9a8f14ba187690
  worlds:
    patches-x4: b28ef5dd21f69a621521e774f70b7336dcac84d5d30d6177b854d5377a52233c
    patches-x8: 1298c38d85f5f5f7a2c4c84b934362e5e1444f4b4d8ca59a13c9f9b16f197806

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none
  borg_world: patches-x8

profile_prefix: reborn-patchx8
arms:
  ctl: {}                                                       # shipped: kill-on-sight with #969's floor 50, confused attack by direction
  floor0: {borg_param_attack_kill_on_sight_min_hp_percent: 0}  # no floor: 9085c266's play of the patch
  ranged:                                                 # #869 undone: the patch's ranged entry only
    borg_scary_list_lines: ["grey mushroom patch | none | | attack"]
  nodir: {borg_param_attack_confused_by_direction: 0}           # #901's switch off (C: melee only while confused)
  rangedclw:                                              # ranged, and CLW counts as a confusion cure (#837)
    borg_scary_list_lines: ["grey mushroom patch | none | | attack"]
    borg_param_caution_confused_clw_cure: 1
control: [ctl]
owner_authorization: >-
  2026-11-22, owner: "can you then think of zoo run with a synthetic world where these patches are 4 or 8 times more
  frequent?", then "yes watch them, and dispatch the x8 pilot" (borg-zoo#665).
extra:
  retain_evidence: true

prespecified: |
  Draft of 2026-11-22, written before any game in these worlds was played. Pilot (RULES 16): 5 arms in patches-x8, classes-18
  (90 games); the arms that lead go to verysmall after the gate and the owner. Games compare only within the world; ctl is
  the control.
  Gate: no config_error; one binary; every cell's config.txt has borg_world and the same borg_world_data_sha256 within a
  world; each arm's values in params-core.json and its scary list copy (the borg_scary_list_lines applied); every cell ends
  in death, turn_cap or borg_stopped; frozen-turn bursts classified; death bundles reproduced (in the world).
  Report per world, arm and class: deaths and causes; patch deaths (killer the grey mushroom patch, or any killer while
  confused next to a patch); CL and DL at death, max CL and DL; paired rescued and newly killed against ctl (exact
  McNemar); identical plays. Per game: grey mushroom patches met ("# Creating a monster 'grey mushroom patch'"),
  killed, and confused turns next to one; "# Attack on sight: grey mushroom patch" and "# Not fixing Confusion next to an
  immobile confuser" notes; CLW quaffed while confused. Check that the world does what it says: patches met per game in x4
  and x8 against the normal-world baseline at 9085c266 (run 45028029063, same Borg). A world is a stress test: a policy
  that wins here still needs the normal world's measurement before a shipped value changes.
