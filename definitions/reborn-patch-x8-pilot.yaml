# The issue number is to be filed. Write the catalogue entries with:
#   python3 -m zoo define definitions/reborn-patch-x8-pilot.yaml
# Its twin, reborn-patch-x4-pilot, is the same arms in the other world.
#
# Specimen: borg-reborn-rs e846f9f9 = track-p 9085c266 + one commit that adds `favour`/`favour_weight` to
# scripts/make-world.py and harness/worlds/patches-x4.txt, patches-x8.txt (every race but the grey mushroom patch gets
