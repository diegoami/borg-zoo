question: On borg-reborn-rs main 162f96af, does letting a level stop being scary once its scary monsters are gone (caution_scary_latch 0) save games without costing any?
tier: big            # classes-1800-big: starts 361-900, 60 per class

specimen: 4.2.6-reborn-rust-main-162f96af

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none
  borg_param_caution_scary_named_monsters: 1

