prespecified: |
  Fixed 2026-11-22, before any start of classes-1800-fresh was played with this build or these arms. Confirmation (RULES 14): the two arms of the lead, ctl and all, on the whole fresh
  block (1,800 starts, 100,000 turns, all classes), 3,600 cells, one binary, evidence not retained. The confirmation test, fixed here: the one-sided exact McNemar test that all has
  fewer deaths than ctl, paired by start, at alpha 0.05; the lead is confirmed only if the test rejects AND all has fewer deaths than ctl, AND mean CL and mean max depth of all fall by
  no more than 0.25 against ctl (P7's margin). Otherwise the development lead is not confirmed (and is reported as not confirmed, RULES 18). Gate: no config_error; one binary; every cell
  ends in death, turn_cap or borg_stopped; stalls and wall timeouts reported start by start. Report per class: deaths and causes, rescued and newly killed, identical plays, CL and
  depth, alive at the cap having reached DL5; a RULES 18 bin. The development tiers (classes-1800 starts 1-900, #626) are not re-used.
