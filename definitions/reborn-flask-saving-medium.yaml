# borg-zoo#649: medium tier follow-up of reborn-flask-saving-pilot.
name: reborn-flask-saving-medium
issue: 649
question: >-
  On borg-reborn-rs bf077c4a (#912, on track-p 9085c266), does a Borg that keeps its flasks of oil while melee is enough
  (attack_flask_saving 2: adjacent monsters and ones coming to melee anyway) play the same or better than the shipped
  Borg, which throws whenever a flask rates highest? And are the melee classes' point-blank overrides (#901) still needed
  once it does?
tier: medium            # classes-1800 starts 91-360, 100,000 turns
specimen: 4.2.6-reborn-rust-flask-saving-bf077c4a

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none

profile_prefix: reborn-flask
arms:
  ctl: {}                                            # as shipped
  save2:
    borg_param_attack_flask_saving: 2
  save2-noov:                                        # and without #901's melee-class overrides
    borg_param_attack_flask_saving: 2
    borg_param_attack_throw_point_blank_divisor__warrior: 1
    borg_param_attack_throw_point_blank_divisor__blackguard: 1
    borg_param_attack_throw_point_blank_divisor__paladin: 1
    borg_param_attack_throw_point_blank_divisor__rogue: 1

control: [ctl]
owner_authorization: >-
  2026-11-22: zoo owner, "yes do all that" (the medium tier; the pilot gate is read and posted on the issue).
extra:
  retain_evidence: false

prespecified: |
  Fixed 2026-11-22 after the pilot gate (run 45033254253: 0 identical plays, ctl 1 death, save2 0, save2-noov 0) and before any result of this tier was read. Medium tier (RULES 14) on the same build:
  classes-1800 starts 91-360 (270 starts per arm, paired), all classes, 100,000 turns, one binary, disjoint from the other tiers of the study (pool them
  as one study, RULES 14). All three arms.
  Gate: no config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts reported start by start.
  Report per arm and class: deaths and causes, CL at death, final and maximum level, deepest level; paired rescued and newly killed against
  the control (exact McNemar), identical plays; a RULES 18 bin. Evidence is not retained at this tier. Descriptive.
