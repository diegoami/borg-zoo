# borg-zoo#192, small tier: healing reserve {0, 200, 400} at healing speed 66 on borg-reborn-rs main HEAD e0aa2e0a.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-heal-reserve-s66-small.yaml
name: reborn-heal-reserve-s66-small
issue: 192
question: On borg-reborn-rs main e0aa2e0a with healing speed 66, which healing reserve (0, 200, 400 percent of max HP) should the town planner use?
tier: small            # classes-1800 starts 1-90 (10 per class)

specimen:
  name: 4.2.6-reborn-rust-main-e0aa2e0a
  repository: diegoami/borg-reborn-rs
  ref: e0aa2e0adb53b9b3d5039cd03ce004bce15765cf
  source: https://github.com/diegoami/borg-zoo/issues/192
  label: >-
    borg-reborn-rs e0aa2e0a, main at the merge of #498: over 7e08c920 (the #192 pilot's specimen) it adds
    #492 (#486: Boldness is no buff to the town planner, no wine bought for it) and #498 (#485: point-blank
    divisor by class, shipped default 5, Ranger 2, Rogue 3). Source-hash rust 028e2de4...; harness/borg.txt
    498475fa... keeps the #491 healing lines at 400 / 100 / 66.
  plans:
    errands_plan.txt: 084bc3e8999697bd8edf7fd302ea75d65b50ef2714afdd3a47354a1f24137e87
    errands_plan_ambitious.txt: c301858598cbb76d529fd49ef6c0c1c75332e4f229785e62459e46b986c6e0c9

# As in the pilot: the shipped harness/borg.txt (speed30 bundle, no plan, no errand) with the three #491
# lines written; speed fixed at 66 (owner), curve at its neutral 100.
settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none
  borg_param_town_heal_curve_scale_percent: 100

profile_prefix: reborn-heal
vary:
  reserve:
    r0: {borg_param_town_heal_reserve_hp_percent: 0}
    r200: {borg_param_town_heal_reserve_hp_percent: 200}
    r400: {borg_param_town_heal_reserve_hp_percent: 400}
  speed:
    s66: {borg_param_town_heal_speed_percent: 66}

control: [r0, s66]
owner_authorization: >-
  2026-11-17: after the #192 pilot (run 44112001529), the owner asked for the small tier with healing
  speed kept at 66 and reserve 0, 200 and 400, on current borg-reborn-rs HEAD. A new specimen, so this is
  not a nested slice of the pilot's specimen; pilot-to-small comparisons are across builds.

prespecified: |
  Fixed 2026-11-17, before any result was read (borg-zoo#192). Small tier on the owner's request; medium
  only after this gate and the owner (RULES 14). Gate: no config_error; one binary; the three
  borg_param_town_heal_* lines with the arm's values (reserve 0/200/400, curve 100, speed 66) in every
  arm's borg.txt and in params-core.json of the death replays; no plan loaded; every cell ends in death,
  turn_cap or borg_stopped; frozen-turn stalls and key outliers listed; death bundles reproduced. Report
  per arm: deaths, final level, deepest level, keys; deaths by class, with low-max-HP casters (Mage,
  Necromancer) called out; paired rescued and newly killed for r200 and r400 against r0 on the same start,
  with an exact McNemar p; healing potions bought (Cure Light/Serious/Critical Wounds, Healing) and gold
