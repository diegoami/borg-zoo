prespecified: |
  Fixed 2026-11-22, before any result of this build was read (borg-zoo#702). Six arms: ctl; light; light+lone; light+leash; light+throw; combined (light + the lone-slow bundle + leash-m0 + all1 + town_hunt 1). light+belief (unseen_belief 1, #879) later, once PR #890 is in track-p (it is not on this pin). Pilot as a gate, then the full tier (classes-1800 starts 901-1800, 900 per arm), matching #695. Interaction: each combined arm against its single-lead arm of #699, #700, #701 at the same pin; the light radius's signature (deaths from a monster the Borg removed from its map shortly before) if the evidence allows. Switching cave_light_engine_radius on would be a P8 change, decided on this run.
  Tier full: classes-1800 starts 901-1800 (900 per arm), one binary, shipped settings plus each arm's overrides, borg-rs core, 100,000 turns, specimen track-p 206cf4e7 (the pin of #695). Gate: no config_error; one binary; each arm's values in params-core.json; every
  cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts apart; identical plays per arm. Report per arm and class: deaths and causes, rescued and newly killed against ctl (exact McNemar), CL and
  depth, alive at the cap having reached DL5; tiers of one study pooled (RULES 14). Descriptive.
