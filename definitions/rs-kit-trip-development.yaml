# Exported from experiments/rs-kit-trip-development.json; edit here, then run python3 -m zoo define.
name: rs-kit-trip-development
description: |-
  Seven choices on the same 1800 starting cases: existing rules, integrated defaults, 1.5x risk forecast, lower attack/support/learning priorities and earlier returns. 12600 games.
prespecified: |-
  Descriptive development study. Rank fewer natural deaths first; then mean final character level, mean deepest level and DL3+ count, including dead characters. Report all incomplete outcomes separately and paired rescued/newly-killed counts. Candidate settings differ one at a time from integrated defaults, except the earlier-return choice deliberately changes both return thresholds. No winner chosen here is confirmed by the independently fixed confirmation.
owner_authorization: |-
  2026-11-15 owner request: schedule experiments after integrating the finished inventory object-capability updates with the all-item trip-return fix. Fewer deaths first, then character level/depth.
