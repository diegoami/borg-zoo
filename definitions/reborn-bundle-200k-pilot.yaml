prespecified: |
  Fixed 2026-11-21, before any result of this build was read (borg-zoo#549). hp-lo is #522's HP minimums -25% (small
  tier: CL +0.11, 0 deaths in 90; 200,000-turn pilot level with ctl); r1p200 is #526's reserve 1 at 200 percent
  (200,000-turn pilot: 0 deaths, CL +0.22, the Mage rescued). Pilot (RULES 16) of the four arms on this build; a small
  tier at 200,000 turns follows only if the gate passes and the owner agrees. 72 games, all classes.
  Gate: no config_error; one binary; each arm's values in params-core.json; every cell ends in death, turn_cap or
  borg_stopped; frozen-turn bursts classified.
  Report per arm and per class: deaths and causes, CL at death, final and maximum level, deepest level; paired rescued
  and newly killed against ctl (exact McNemar), identical plays; for both against hplo and against r1p200 whether the
  effects add (CL and DL differences) or cancel. Descriptive (RULES 14).
