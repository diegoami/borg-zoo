# borg-zoo#274: attack preferences by class (#520's class files), verysmall tier; owner request 2026-11-18.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-attack-by-class-verysmall.yaml
#
# Each attack_preference_<class>_<family>_permille acts on that class only, so one arm moves every class one step
# and each class is read on its own starts. Neutral is 1000 (range 500-2000); half scales each shipped
# value's distance from 1000 by 0.5. (The pilot's strong arm, x1.5, is dropped.)
name: reborn-attack-by-class-verysmall
issue: 274
question: >-
  On borg-reborn-rs main 4a482c58, does each class do better with its shipped attack preferences than with neutral
  preferences (1000), or with their distance from neutral halved?
tier: verysmall        # classes-1800 starts 1-45: 5 per class, 100,000 turns

specimen:
  name: 4.2.6-reborn-rust-main-4a482c58
  repository: diegoami/borg-reborn-rs
  ref: 4a482c58ab9ab86a663ed6549ef41d62046cf033
  label: >-
    borg-reborn-rs 4a482c58, main after #539 (caution_scary_hurt_percent 50, caution_scary_afraid 1) and fba1c6e0
    (borg_trip_unknown_stacks 2, caution_stair_scum_threat 1). Shipped healing: common reserve 100, curve 125, real HP
    1, speed 66; class files curve/reserve Warrior 50/100, Mage 150/300, Druid 125/250, Priest 125/250, Necromancer
    150/300, Paladin 75/150, Rogue 100/200, Ranger 100/200, Blackguard 75/150.
  plans:
    errands_plan.txt: 084bc3e8999697bd8edf7fd302ea75d65b50ef2714afdd3a47354a1f24137e87
    errands_plan_ambitious.txt: c301858598cbb76d529fd49ef6c0c1c75332e4f229785e62459e46b986c6e0c9
  scary_lists:
    scary_monsters.txt: d045111ba9ac6b491f6ffd46aefe722ce08477851c47f4065f10c660a5dc9342

