owner_authorization: >-
  2026-11-18: the owner asked for the next tier of #274 after the pilot (run 44308236915, gate passed). strong is
  dropped: it played the shipped keys in 15 of 18 pilot games, and Mage spell and Ranger projectile are at the cap.
prespecified: |
  Fixed 2026-11-18, after the pilot (run 44308236915) and before any verysmall result was read. Same specimen and the
  pilot's ctl, flat and half arms (RULES 16); strong dropped. The pilot showed play changes but no death difference:
  deaths 1/1/2 of 18, games identical to ctl flat 8 and half 11; Priests and Blackguards played ctl's keys in every arm.
  Gate:
  - no config_error; one binary; each arm's 16 class lines in its borg.txt;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class (5 starts each), not pooled: deaths and causes, final level, deepest level; paired rescued and newly
  killed against ctl; identical plays per class. Descriptive only: a class whose arm leads goes to small-rest (starts
  46-90) on the owner's word; a class that plays ctl's keys again is dropped from the study.
