    borg_param_attack_preference_paladin_melee_permille: 1000
    borg_param_attack_preference_paladin_spell_permille: 1000
    borg_param_attack_preference_rogue_projectile_permille: 1000
    borg_param_attack_preference_rogue_thrown_permille: 1000
    borg_param_attack_preference_ranger_projectile_permille: 1000
    borg_param_attack_preference_blackguard_melee_permille: 1000
    borg_param_attack_preference_blackguard_spell_permille: 1000
  half:     # distance from 1000 halved
    borg_param_attack_preference_warrior_melee_permille: 1400
    borg_param_attack_preference_warrior_projectile_permille: 1100
    borg_param_attack_preference_warrior_thrown_permille: 1100
    borg_param_attack_preference_mage_spell_permille: 1500
    borg_param_attack_preference_mage_device_permille: 1100
    borg_param_attack_preference_druid_spell_permille: 1350
    borg_param_attack_preference_priest_spell_permille: 1350
