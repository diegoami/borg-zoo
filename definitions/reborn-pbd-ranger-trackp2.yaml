prespecified: |
  Development re-measure (RULES 14), fixed before any result. The 200 Ranger starts of classes-1800 (the four tiers
  above; the same starts as #290's development, so the result is comparable with f660aecc's 11 against 18).
  Primary: deaths, divisor 1 against 2, paired by start, exact McNemar (descriptive at this stage).
  Secondary: CL1-3 deaths; mean max CL and max DL; alive at the cap; games identical to ctl; arrows fired, broken and
  bought per game; shots at an adjacent monster per game; deaths by cause.
  Gate: no config_error; one binary; each arm's line verified in its borg.txt / settings-resolved.json; every cell ends
  in death, turn_cap or borg_stopped, with every stall, timeout and crash reported.
  If deaths fall (a lead), the confirmation is a prespecified test on Ranger starts no decision has read: the Ranger
  starts of classes-1800-fresh (classes-1800-b-rangers was used by #290's confirmation).
