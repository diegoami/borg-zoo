# borg-zoo#265: the healing settings by class (borg-reborn-rs#487's class files), pilot; owner request 2026-11-18.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-heal-by-class-pilot.yaml
#
# Each _<class> override acts on that class only, so one arm can move every class's value one step at once
# and each class is read on its own starts: one experiment holds nine per-class sweeps. The global healing
# settings (real HP reserve, speed) stay at their shipped values in every arm.
name: reborn-heal-by-class-pilot
issue: 265
question: >-
  On borg-reborn-rs main 4a482c58, does each class do better with its shipped healing curve and reserve than with half
  or one and a half times either value, or than with the common values (class files off)?
tier: pilot            # classes-18: 9 classes x 2 seeds, 100,000 turns

specimen:
  name: 4.2.6-reborn-rust-main-4a482c58
  repository: diegoami/borg-reborn-rs
  ref: 4a482c58ab9ab86a663ed6549ef41d62046cf033
  label: >-
    borg-reborn-rs 4a482c58, main after #539 (caution_scary_hurt_percent 50, caution_scary_afraid 1) and fba1c6e0
    (borg_trip_unknown_stacks 2, caution_stair_scum_threat 1). Shipped healing: common reserve 100, curve 125, real HP
    1, speed 66; class files curve/reserve Warrior 50/100, Mage 150/300, Druid 125/250, Priest 125/250, Necromancer
    150/300, Paladin 75/150, Rogue 100/200, Ranger 100/200, Blackguard 75/150.
  plans:
