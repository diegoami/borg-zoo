prespecified: |
  Fixed 2026-11-18, before any result on 4a482c58 was read. Pilot (RULES 16). Earlier healing runs (heal-curve,
  heal-curve2, heal-class) were on other refs and are context only.
  Gate:
  - no config_error; one binary; each arm's lines in its borg.txt and in params-core.json of the death replays
    (in common, every class resolves to reserve 100 and curve 125);
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class (each class's own starts), not pooled:
  - deaths and causes, final level, deepest level;
  - paired rescued and newly killed against ctl, and identical plays per class: a class whose arm plays ctl's keys
    did not exercise that value;
  - healing potions bought (Cure Light, Cure Serious, others) and gold spent on healing per game, healing potions
    carried at death, deaths with none left.
  Two starts per class per arm show only whether a value changes play in that class. Per-class direction needs the
  next tiers (verysmall 5, small 10, medium 40 starts per class), dropping the arms and classes that played ctl's
  keys.
