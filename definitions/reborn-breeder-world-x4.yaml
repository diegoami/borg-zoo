prespecified: |
  Fixed 2026-11-20, before any result of this definition was read (borg-reborn-rs #704, PR #740). classes-18 is
  the gate (RULES 16); small and medium (starts 1-360) follow right after it.
  Gate:
  - no config_error; one binary; every cell's config.txt has borg_world=breeders-x4 and
    borg_world_data_sha256 the same in every arm; each arm's values in borg.txt and params-core.json;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced (in the world: the rerun needs the same borg.txt, so the same world).
  Report per arm and per class:
  - deaths and causes, final and maximum level, deepest level; breeder deaths (the killer has MULTIPLY);
  - paired rescued and newly killed against ctl (exact McNemar), and games identical to ctl;
  - breeders created ("# Creating a monster" of a MULTIPLY race) and killed per game; "# Breeders cannot be
    stopped" and "# Not resting: breeders to hunt" per game;
  - mean max CL and DL against ctl.
  A breeder world is a stress test: a switch that helps here still needs normal play's measurement (borg-zoo#460)
  before its shipped value changes.
