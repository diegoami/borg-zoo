control: [ctl]
owner_authorization: >-
  2026-11-20: borg-reborn-rs owner, "yes start experiment trying other values for the leash settings"; zoo owner,
  2026-11-20: dispatch pilots and small runs, no heavy jobs.
extra:
  retain_evidence: true

prespecified: |
  Fixed 2026-11-20, before any result of this definition was read (borg-reborn-rs #732, PR #755). classes-18 is
  the gate (RULES 16); small and medium (starts 1-360) follow after it.
  Gate:
  - no config_error; one binary; each arm's values in borg.txt and in params-core.json of the death replays;
  - ctl plays as main's shipped settings (same games as a main ec0f3b28 run with no overrides);
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Report per arm and per class:
  - deaths and causes, character level at death (CL1-4 / 5-19 / 20+), final and maximum level, deepest level;
  - paired rescued and newly killed against ctl (exact McNemar), and games identical to ctl;
  - mean max CL and max DL against ctl, and turns to CL5 / CL10;
  - "# Flowing toward dark" notes per game (exploration), and, for every death, the flow distance to the nearest
    known staircase when the killer was first seen, if the logs allow;
  - RULES 18 bin per arm.
  Exploratory deaths (owner, 2026-11-20) do not count toward the gate.
