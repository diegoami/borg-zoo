  tight:    {borg_param_flow_leash_per_level: 2, borg_param_flow_leash_base: 5}
  loose:    {borg_param_flow_leash_per_level: 5, borg_param_flow_leash_base: 15}
  margin0:  {borg_param_flow_leash_depth_margin: 0}
  margin10: {borg_param_flow_leash_depth_margin: 10}
