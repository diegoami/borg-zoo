name: reborn-c-leash-values-pilot
issue: 506
question: >-
  On borg-reborn-rs main ec0f3b28, do other values of C's exploration leash (size, depth margin, none) save deaths
  or buy progress against C's values?
tier: pilot            # classes-18 gate, then small + medium (starts 1-360), 100,000 turns

