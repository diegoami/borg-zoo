  name: 4.2.6-reborn-rust-main-ec0f3b28
  repository: diegoami/borg-reborn-rs
  ref: ec0f3b28ec168f69f19f1852fd0083d0e28cb510
  label: "borg-reborn-rs main ec0f3b28 (PR #755, C's leash as flow_leash_* settings). Source-hash rust f06d660f...; harness/borg.txt 211451a4..."
