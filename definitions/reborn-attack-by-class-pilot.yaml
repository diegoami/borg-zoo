issue: 274
question: >-
  On borg-reborn-rs main 4a482c58, does each class do better with its shipped attack preferences than with neutral
  preferences (1000), or with their distance from neutral halved or made half again larger?
tier: pilot            # classes-18: 9 classes x 2 seeds, 100,000 turns

