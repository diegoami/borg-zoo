# borg-zoo#274: attack preferences by class (#520's class files), pilot; owner request 2026-11-18.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-attack-by-class-pilot.yaml
#
# Each attack_preference_<class>_<family>_permille acts on that class only, so one arm moves every class one step
# and each class is read on its own starts. Neutral is 1000 (range 500-2000); half and strong scale each shipped
# value's distance from 1000 by 0.5 and 1.5 (capped at 2000).
