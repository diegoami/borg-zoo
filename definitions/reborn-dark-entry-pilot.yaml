prespecified: |
  Fixed 2026-11-21, before any result of this build was read (borg-zoo#546). Initial screen on starts already read in
  #480 and #522, so a mechanism check; confirmation needs a fresh owner-opened block.
  Gate: no config_error; one binary; the value in params-core.json; every cell ends in death, turn_cap or borg_stopped.
  Report by class: death by the cap (primary), rescued and newly killed pairs, unfinished runs by type, mean CL and max
