  source_notes: |-
    All arms pin merged PR88 on M13 at 7251f64a9c3bf75fb8b90940d3fda54c4fa610bb. This is a new experiment and new specimen; historical pins and results are preserved. The four numeric pairs and all shopping settings are copied exactly from PR85. Inherited return rules remain active. The added return switch does not change live shopping forecasts, combat reserves or inherited depth decisions. The previous experiment was M12, so cross-run comparisons also change milestone and are descriptive only.
