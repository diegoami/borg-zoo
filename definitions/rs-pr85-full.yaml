# Exported from experiments/rs-pr85-full.json; edit here, then run python3 -m zoo define.
name: rs-pr85-full
description: |-
  Full-suite owner-selected return-threshold development: existing-rules and new-shopping/old-returns controls plus (pack slack, eligible unknown stacks)=(0,0),(1,2),(1,4),(2,4). Six choices, 1800 fresh starts each, 10800 games. Legacy selling pressure is preserved in every arm.
prespecified: |-
  Owner-selected development calibration, fixed before dispatch. Four exact threshold pairs: (0,0),(1,2),(1,4),(2,4). Zero pack slack means full pack; zero unknown threshold explicitly disables learning-driven returns. Every arm preserves inherited selling-pressure backstops, supply restock, preparedness and safety logic. Calibrated shopping is identical in all four threshold arms; existing-rules and new-shopping/legacy-returns controls isolate shopping and the added trip policy. Primary descriptive measurement: paired natural-death differences at the 100000-world-turn after-key cap on complete matched pairs. Report all noncompletions and unmatched pairs first, not as deaths/survivors. Paired McNemar statistics are descriptive across this multi-arm development set. Report every comparison, including null effects when inherited rules request an earlier return. Secondary: mean final CL, mean deepest DL, DL3+ including dead characters; native town arrivals, sampled town time, newly set custom return goals, pre-existing return goals, selling/restock notes and unfinished return requests; actual class purchases. Compare (1,4) against (2,4) for the pack threshold and (1,2) against (1,4) for the learning threshold; (0,0) changes both and is not an isolated-factor contrast. New custom-goal observations establish only a goal transition at that consultation, not a claim that the character would never return otherwise. No mid-run retuning or accepted winner. A later prespecified fresh-seed confirmation is required before an improvement claim.
owner_authorization: |-
  2026-11-15 owner explicitly requested merge of PR85, restore the old selling-pressure fallback, and tune exactly (borg_trip_pack_slack,borg_trip_unknown_stacks)=(0,0),(1,2),(1,4),(2,4) on a full Borg Zoo suite. Two existing-return controls are retained. Six concurrent game jobs, one game process each.
