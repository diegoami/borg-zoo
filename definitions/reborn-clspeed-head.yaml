prespecified: |
  Fixed 2026-11-24, before any result (Rule 22, #758). Progress endpoint CL5 reached by 100,000 turns - known attainment out of all starts, deaths, unfinished and alive at the cutoff with CL5 reported separately; DL3/DL5 and level arrival as diagnostics. SAFETY CONSTRAINT (the owner's word): deaths stay at 0, and scumming itself stays ON - the arms tune its parameters, none removes it (removing scumming outright would cost lives). An arm whose deaths rise cannot be adopted however fast it levels; the read states any death with its cause and a /death-report pack. Gate: no config_error; one binary; each arm's value in params-core.json; every cell ends in death, turn_cap or borg_stopped; identical plays per arm. Report per arm against ctl: the CL5 endpoint, paired CL5 gained/lost (exact McNemar), the turn of first reaching character level 5 where recorded (a direct speed read), deaths, identical plays. Descriptive (RULES 14); ladder on the owner's word.
