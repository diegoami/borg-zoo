  Fixed 2026-11-23, before any cell of this experiment is read. Specimen borg-reborn-rs 30167dac, default borg-rs core, shipped harness/borg.txt; seven arms on classes-18 at 100,000 turns (126 cells). The pilot is the gate, not a measurement (RULES 14, 16).
