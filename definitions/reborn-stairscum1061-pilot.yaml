# borg-zoo#721 / borg-reborn-rs#1061 (PR #1090): the stair_scum exploration mode for characters under 25 max HP, the pilot.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-stairscum1061-pilot.yaml
name: reborn-stairscum1061-pilot
issue: 721
question: >-
  On borg-reborn-rs track-p c687334c merged with #1061 (0d09e318), does the stair_scum mode
  (an exploration bounded by a retreat a +10 monster cannot win, while max HP < 25 and no
  monster detection) cut the deaths of weak characters, at what cost in level and depth, strict
  and with its two loosening dials, against the control and the kit leash?
tier: pilot

specimen:
  name: 4.2.6-reborn-rust-stair-scum-0d09e318
  repository: diegoami/borg-reborn-rs
  ref: 0d09e31843d591987bb61f7b20d26f9ab30319b6
  label: >-
    borg-reborn-rs LINE task/1061-stair-scum (PR #1090) at 0d09e318: track-p c687334c (the #926
    fast-fragile bundle shipped, #1074) merged with #1061's stair_scum mode (with the fixes of Codex's review of #1090) and its slack dials (steps, per max HP, per level; the per-level rate at its default 50), every #1061 value at its
    neutral setting (stair_scum 0, smoke-borg-rs 4/4 identical); shipped harness/borg.txt,
    scary_monsters.txt 5a4ec4b6..., borg-rs core.
  scary_lists:
    scary_monsters.txt: 5a4ec4b6221f2487d19bd3146c9c36ed7e3a619b1bf9d14dbd9a8f14ba187690

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none

profile_prefix: reborn-ss1061
arms:
  ctl: {}
  # Every stair_scum arm inherits stair_scum_slack_per_level_percent = 50, the default (the owner, 2026-11-23).
  scum: {borg_param_stair_scum: 1}
  level0: {borg_param_stair_scum: 1, borg_param_stair_scum_slack_per_level_percent: 0}
  slack1: {borg_param_stair_scum: 1, borg_param_stair_scum_slack_steps: 1}
  slack2: {borg_param_stair_scum: 1, borg_param_stair_scum_slack_steps: 2}
  rate1: {borg_param_stair_scum: 1, borg_param_stair_scum_slack_per_hp_tenths: 1}
  hp30: {borg_param_stair_scum: 1, borg_param_stair_scum_max_hp: 30}
  kitleash: {borg_param_kit_leash: 1}
  # The owner, 2026-11-23, for the class arm: "I would set max_hp lower, to 20".
  # The owner, 2026-11-23: "stair_scum_slack_steps = 1 for druid and necromancers. 2 for mage and priest, 3 for ranger,
  # 4 for paladin and blackguard, none for warrior" (warrior: the mode off; rogue: 3, the owner's choice).
  byclass:
    borg_param_stair_scum: 1
    borg_param_stair_scum_max_hp: 20
    borg_param_stair_scum__warrior: 0
    borg_param_stair_scum_slack_steps__druid: 1
    borg_param_stair_scum_slack_steps__necromancer: 1
    borg_param_stair_scum_slack_steps__mage: 2
    borg_param_stair_scum_slack_steps__priest: 2
    borg_param_stair_scum_slack_steps__ranger: 3
    borg_param_stair_scum_slack_steps__rogue: 3
    borg_param_stair_scum_slack_steps__paladin: 4
    borg_param_stair_scum_slack_steps__blackguard: 4
control: [ctl]
owner_authorization: >-
  2026-11-23, borg-reborn-rs owner on the #1061 session: "push to task/1061-stair-scum and file
  the zoo request", then "start zoo test". The pilot first (RULES 16).

prespecified: |
  Fixed 2026-11-23, before any cell of this experiment is read. Specimen borg-reborn-rs 0d09e318, default borg-rs core, shipped harness/borg.txt; nine arms on classes-18 at 100,000 turns (162 cells); every stair_scum arm at stair_scum_slack_per_level_percent 50 (the default) except level0 (0, the strict count of the review). The pilot is the gate, not a measurement (RULES 14, 16).
  Gate: no config_error; one binary for every arm; each arm's values in params-core.json (stair_scum, stair_scum_slack_steps, stair_scum_slack_per_hp_tenths, stair_scum_max_hp (20 in byclass), stair_scum_slack_per_level_percent, kit_leash; byclass's class values for each class in settings-resolved.json, the Warrior with stair_scum 0); every cell ends in death or turn_cap, none in stall, timeout or crash; ctl plays the shipped game (stair_scum 0); in each stair_scum arm the mode acts (in byclass, never for the Warriors) (its "# Stair scum:" notes appear in the cells whose characters start under the threshold).
  Reported per arm, paired by start against ctl: deaths, deaths at CL <= 2 and while max HP < 25; CL at 25k, 50k and 100k turns (milestones); starts reaching DL3 and DL5 with their first turn there (first_turn_at_depth); identical plays. Descriptive at this size; the next tier (verysmall, starts 1-45) only after the gate is checked and the owner agrees, with the arms the owner keeps.
