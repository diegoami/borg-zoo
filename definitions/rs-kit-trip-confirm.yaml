# Exported from experiments/rs-kit-trip-confirm.json; edit here, then run python3 -m zoo define.
name: rs-kit-trip-confirm
description: |-
  Fixed integrated defaults versus existing rules on 1800 fresh starting cases: 3600 games. Expanded inventory capability coverage and all-item learning returns act together.
prespecified: |-
  Fixed before dispatch: integrated defaults versus existing rules, paired natural death by the 100000-turn after-key cap, exact two-sided McNemar alpha 0.05 on pairs where both finish. Noncompletion categories remain visible and are not deaths or survivors; report their balance and incomplete pairs before interpreting survival. Secondary descriptive measures: mean final character level, mean deepest level and DL3+ count including dead characters; per-class results descriptive. Development winners cannot replace the default candidate. Sizing: with 0.36 discordance, 1800 completed pairs give about 80% power for a four-percentage-point absolute paired death difference using (1.96+0.842)^2*0.36/0.04^2 = 1767. This is a planning assumption, not evidence from the repaired model; incomplete pairs and smaller effects reduce power.
owner_authorization: |-
  2026-11-15 owner request: schedule experiments after integrating the finished inventory object-capability updates with the all-item trip-return fix. Fewer deaths first, then character level/depth.
