  Fixed 2026-11-24, before any result (Rule 22, #758). RULES 16 pilot on the new specimen (track-p head 52fff0de, the #1209 stair-scum extension merge): classes-18, all arms, evidence not retained; the ladder tiers (verysmall, small-rest, medium) run the exercised arms after this gate, disjoint starts, on the owner's word. Scumming's other parameters stay shipped; the arms dial single parameters two-sided, plus the owner's slack steps +1/+2 per class (shipped at this ref: warrior 4, mage 2, druid 1, priest 2, necromancer 1, paladin 4, rogue 3, ranger 3, blackguard 4) and the owner-named scum0 (scumming fully off). SAFETY: the owner expects scum0 to cost some deaths - its read reports every death with cause and a /death-report pack, and scum0 cannot be adopted while its deaths exceed ship's; every other arm is held to deaths-0 strictly (an arm whose deaths rise cannot be adopted however fast it levels). Gate: no config_error; one binary; each arm's values in params-core.json; every cell ends in death, turn_cap or borg_stopped; identical plays per arm. Progress endpoint CL5 reached by 100,000 turns - known attainment out of all starts, deaths, unfinished and alive at the cutoff with CL5 reported separately; DL3/DL5 and level arrival as diagnostics; median first-turn-at-level-5 where recorded. Report per arm against ship: the CL5 endpoint, paired CL5 gained/lost (exact McNemar), deaths and causes, rescued/newly killed, identical plays, median first-L5 turn. Descriptive (RULES 14).
