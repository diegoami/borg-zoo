prespecified: |
  Fixed 2026-11-22 after the pilot gate (run 45033226329: CL gap of the Recall/Phase parts (-0.45) remains, depth gap does not) and before any result of this tier was read. Small tier (RULES 14) on the same build:
  classes-1800 starts 1-45 (45 starts per arm, paired), all classes, 300,000 turns (the suite classes-1800-300k-verysmall, as #616's small tier), one binary, disjoint from the other tiers of the study (pool them
  as one study, RULES 14). All four arms (ctl, shipped, variety, kit).
  Gate: no config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts reported start by start.
  Report per arm and class: deaths and causes, CL at death, final and maximum level, deepest level; paired rescued and newly killed against
  the control (exact McNemar), identical plays; a RULES 18 bin. Evidence is not retained at this tier. Descriptive.
