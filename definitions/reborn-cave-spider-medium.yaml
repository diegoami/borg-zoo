  Fixed 2026-11-22 after the pilot gate (run 45033305701: one shared death; stats and stats-contact identical to ctl) and before any result of this tier was read. Medium tier (RULES 14) on the same build:
  classes-1800 starts 91-360 (270 starts per arm, paired), all classes, 100,000 turns, one binary, disjoint from the other tiers of the study (pool them
