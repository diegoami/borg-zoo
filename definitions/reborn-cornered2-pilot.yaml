name: reborn-cornered2-pilot
issue: 224
question: Does cornered mode save more games if it triggers earlier (danger at half the HP) or from further away?
tier: pilot            # classes-18: 9 classes x 2 seeds

specimen: 4.2.6-reborn-rust-main-d9ff9808

# Every arm reads the shipped harness/borg.txt with cornered mode on and the big-level margin at the shipped 0; only the
