prespecified: |
  Fixed 2026-11-23, before any game of this build was played (borg-zoo#742). The medium tier (RULES 14) of reborn-guards-pilot on the same build and arms:
  classes-1800 starts 91-360, all classes, 100,000 turns, one binary, disjoint from the other tiers (pool small and medium as one study). Gate: no
  config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls and wall timeouts reported start by start. Report per arm and
