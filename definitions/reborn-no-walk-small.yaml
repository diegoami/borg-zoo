  ctl: {}
  nowalk: {borg_param_fast_fragile_no_walk: 1}
  nowalk-stats: {borg_param_fast_fragile_no_walk: 1, borg_param_fast_fragile_by_stats: 1}
control: [ctl]
owner_authorization: >-
  2026-11-21: zoo owner, "dispatch all the waiting follow-ups" (the small tier; the pilot gate is read and posted on the issue).
