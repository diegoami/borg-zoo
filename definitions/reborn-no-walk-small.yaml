prespecified: |
  Fixed 2026-11-21 after the pilot gate (run 44936423074: 0 deaths, 18 of 18 identical plays in both arms) and before any result of this tier was read. Small tier (RULES 14) on the same
  build: classes-1800 starts 1-90 (90 starts per arm), all classes, 100,000 turns, one binary, disjoint from the other tiers
  of the study (pool them as one study, RULES 14). 
  Gate: no config_error; one binary; every cell ends in death, turn_cap or borg_stopped; stalls reported start by start; frozen-turn
