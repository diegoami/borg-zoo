prespecified: |-
  Configuration and wiring only. Inspect all 54 endpoints, native effective settings against each arm, actual class/race, and source/binary identity (borg-rs 8c5d000a with PR88 and PR92). Natural deaths are normal endpoints. Report every abnormal outcome, frozen-turn stall and key outlier. Check from the retained native receipts that Home transfers settle (no store/take reversal within a visit), and that policy-off shopping and (0,0) keys are equal where no added return request changes play. No performance inference from these nine starts. No arm of rs-home-fix-returns is dispatched until these checks pass.
owner_authorization: |-
