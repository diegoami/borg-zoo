prespecified: |
  Fixed 2026-11-20, before any result of this build was read (borg-zoo#526). Pilot (RULES 16); a small tier of the arms
  that lead, and the 200 Ranger starts, follow after the gate and the owner. Seven arms, 18 starts each (126 games).
  Gate: no config_error; one binary; each arm's reserve and percent in params-core.json; ctl plays as main d745d9fc's
