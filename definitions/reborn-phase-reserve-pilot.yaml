# borg-zoo#526: calibrate town_phase_reserve (borg-reborn-rs #761, PR #778 merged); owner 2026-11-20: important.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-phase-reserve-pilot.yaml
