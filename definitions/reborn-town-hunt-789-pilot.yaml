# borg-zoo#538: ranged reserve and town hunt against the DL1 shopping loop (borg-reborn-rs #789, PR #800).
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-town-hunt-789-pilot.yaml
name: reborn-town-hunt-789-pilot
issue: 538
question: >-
  Do the opt-in ranged reserve and the advantage-based town hunt reduce the town <-> DL1 shopping loop (borg-reborn-rs
  #604, #385's earlier pilot) without new deaths, and does caution_winning_fight (which also decides town attacks,
  shipped 1) change what the town hunt does?
tier: pilot            # classes-18, 100,000 turns; larger tiers after the gate and the owner

specimen:
  name: 4.2.6-reborn-rust-town-hunt-8e0f20af
  repository: diegoami/borg-reborn-rs
  ref: 8e0f20af735b5c19986fdc119deb04cc0ed64391
  label: "borg-reborn-rs task/T789-town-hunt 8e0f20af (PR #800): town_ranged_reserve and town_hunt, all shipped off. Source sha e5640d8f..., harness/borg.txt 5214f597..., scary_monsters.txt 9766d882..."
  scary_lists:
    scary_monsters.txt: 9766d882edd205e416a716a9031284dd87de6f369a7ba13b6dc248f849473f7f

settings:
  borg_reborn_core: borg-rs
  borg_reborn_errand: none

profile_prefix: reborn-townhunt
arms:
  ctl: {}
  reserve:
    borg_param_town_ranged_reserve: 6
  hunt: &hunt
    borg_param_town_hunt: 1
    borg_param_town_hunt_ranged_bonus_percent: 50
    borg_param_town_hunt_min_hp_percent: 50
  combined:
    <<: *hunt
    borg_param_town_ranged_reserve: 6
  hunt-nofight:        # the owner's note: caution_winning_fight also decides town attacks; ship 1, here 0
    <<: *hunt
    borg_param_caution_winning_fight: 0
  combined-nofight:
    <<: *hunt
    borg_param_town_ranged_reserve: 6
    borg_param_caution_winning_fight: 0
control: [ctl]
owner_authorization: >-
  2026-11-20: borg-reborn-rs session request (#789, PR #800); zoo owner, 2026-11-20: "do as advised" and "we have
  parameter caution_winning_fight for town attacks" (a pilot only, all classes).
extra:
  retain_evidence: true

prespecified: |
  Fixed 2026-11-20, before any result of this build was read (borg-zoo#538). Pilot (RULES 16); larger tiers after the
  gate and the owner. Six arms, 18 starts each (108 games), all classes. The issue's four arms plus hunt-nofight and
  combined-nofight (the same with caution_winning_fight 0; it ships 1, and decides town attacks too).
  Gate: no config_error; one binary; each arm's values in params-core.json; ctl plays as the build's shipped settings;
  every cell ends in death, turn_cap or borg_stopped (stalls, timeouts and crashes kept apart); frozen-turn bursts
  classified.
  Report per arm and per class: deaths and causes, CL at death, final and maximum level, deepest level; paired
  rescued and newly killed against ctl (exact McNemar), identical plays; the shopping loop per game (town <-> DL1
  trips, turns in town, transactions from town-transactions.jsonl, trips that buy nothing new); town hunt kills and
  town attack notes with winning_fight accepting or refusing; deaths in town. Descriptive (RULES 14).
