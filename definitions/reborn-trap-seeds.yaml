question: >-
  On borg-reborn-rs track-p 91dd0d0a, do the #1067 trap rules (recover to the stairs after a hurting trap, clear a trap that cuts the way back, leave a trap-dense level), shipped on, lower the deaths of weak characters against the play before them, on the 20 level-1 death seeds and on classes-1800?
