# Exported from experiments/rs-joint-m12-confirm.json; edit here, then run python3 -m zoo define.
name: rs-joint-m12-confirm
description: |-
  Prespecified fresh-seed check of the fixed locally selected risk-2000 candidate against existing behaviour and untuned live policies. Three arms, 5400 games on classes-1800-b.
prespecified: |-
  Fixed before dispatch. Primary: risk2000 versus old-control, paired natural death by the 100000-turn after-key cap on cases where both finish, exact two-sided McNemar alpha 0.05. All noncompletion categories remain reported and are not relabelled as deaths or survivors. Secondary descriptive comparison: risk2000 versus live-reference. Mean final character level, mean deepest level and DL3+ count are secondary descriptive measures, per-class figures descriptive. Candidate risk2000 is fixed from the local 45+45 study; development-suite variation winners cannot be substituted. Sizing: local fresh cases had discordance 16/45 and net death difference 2/45; the normal paired approximation (1.96+0.842)^2*(16/45)/(2/45)^2 is about 1413 cases for 80% power under those uncertain pilot assumptions. The standard 1800-case suite exceeds that approximation; incomplete pairs reduce effective size. No general improvement claim from a development table.
owner_authorization: |-
  2026-11-14 session request: schedule full zoo runs of the best joint trip/inventory settings and variations; improved shopping must act, not just shadow.
