name: reborn-trip-3x3-classes-18
issue: 123
description: |-
  borg-zoo#123 3x3 pilot on whether the trip policy belongs in the study: plan (none, errands_plan.txt, errands_plan_ambitious.txt) x shopping (off; M13 live town planner only; town planner + trip policy) on 4.2.6-reborn-rust-plans-m13-fix90 (borg-reborn-rs 8a0b57c8, #415), classes-18 (9 classes x 2 seeds, assigned birth, 100,000-turn cap). 162 games.
prespecified: |-
  Fixed 2026-11-16, before any result was read. Pilot, not a measurement. It checks that all nine arms run: every cell ends in death, turn_cap or borg_stopped; no config_error; loaded-plan copies match their pins and are absent in no-plan arms; frozen-turn stalls and key outliers are listed. Descriptively, per plan row, the town-only and town+trip columns are compared (deaths, final level, deepest level, keys, paired rescued/newly killed), which is the trip policy's contribution. 18 starts per arm cannot show whether the trip policy is good; that needs a development-size run. On this build the trip switch selects borg-rs#88's additive trip policy (it only adds return requests), the one the development study would use, and the town planner carries #92's Home guard. Trip arms use the specimen's borg.txt thresholds: borg_trip_pack_slack = 2, borg_trip_unknown_stacks = 4. First dispatched on 1c4b351b (runs 43861771985, 43862121256, 43862742496) and cancelled each time before collecting; moved to this specimen before any result was read.
owner_authorization: |-
  2026-11-16: the owner asked for a 3x3 pilot for #123, because whether the trip policy is good has not been established; the development arms keep it off until then.
