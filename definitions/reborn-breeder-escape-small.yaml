prespecified: |
  Fixed 2026-11-18, before any result was read (borg-zoo#240). Small tier, dispatched with the medium tier on
  the owner's request; together they are starts 1-360 of every arm and are analysed as one (RULES 14). Gate: no
  config_error; one binary; each arm's #544 values in borg.txt and in params-core.json of the death replays; every
  cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed; death bundles
  reproduced; in no death replay a "# Desperate for Stairs (down, no up stairs known)" note, and in ctl's none a
  "# Leaving the breeders' room" note. Primary: deaths per arm over starts 1-360, paired against ctl (rescued, newly
  killed, exact McNemar p; three comparisons). Secondary: breeder deaths (killer has MULTIPLY in the build's
  monster.txt) per arm, and their rescue against ctl, which is what the pilot could not measure; mean final level
  and deepest level; deaths by class; from the death replays, deaths within 200 game turns of a breeder-exit note.
  Pilot: 1 death per arm (the same game), no breeder death; d10 fired least for the same outcome.
