prespecified: |
  Fixed 2026-11-19, before any result on 38858846 was read. Pilot (RULES 16), the same six arms as the 4a482c58 pilot.
  4a482c58 (context only, a different game): deaths ctl 1, curve-lo 2, curve-hi 1, reserve-lo 3, reserve-hi 1,
  common 2 of 18; both Druids died with common and reserve-lo, neither with the shipped values.
  Gate:
  - no config_error; one binary; each arm's lines in its borg.txt and in params-core.json of the death replays;
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class (each class's own starts), not pooled: deaths and causes, final level, deepest level; paired rescued
  and newly killed against ctl; identical plays per class; healing potions bought and carried at death. Each value is
  reported as harmful, neutral (safe to adopt) or helpful (RULES 18). Two starts per class show direction only.
