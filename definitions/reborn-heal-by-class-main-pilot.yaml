# borg-zoo#265: the healing settings by class (borg-reborn-rs#487's class files), pilot; owner request 2026-11-18.
# Write the catalogue entries with: python3 -m zoo define definitions/reborn-heal-by-class-main-pilot.yaml
#
# Each _<class> override acts on that class only, so one arm can move every class's value one step at once
# and each class is read on its own starts: one experiment holds nine per-class sweeps. The global healing
# settings (real HP reserve, speed) stay at their shipped values in every arm.
name: reborn-heal-by-class-main-pilot
issue: 265
question: >-
  On borg-reborn-rs main 38858846, does each class do better with its shipped healing curve and reserve than with half
  or one and a half times either value, or than with the common values (class files off)?
tier: pilot            # classes-18: 9 classes x 2 seeds, 100,000 turns

