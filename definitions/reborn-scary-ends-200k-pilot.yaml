prespecified: |
  Fixed 2026-11-19, before any result was read. Pilot (RULES 16), 200,000 turns.
  Gate:
  - no config_error; one binary; each arm's appended lines in the run's scary list (hash recorded per cell);
  - every cell ends in death, turn_cap or borg_stopped; frozen-turn bursts classified and key outliers listed;
  - death bundles reproduced.
  Read per class: identical plays against ctl; deaths and causes, CL1-3 deaths, final level, deepest level; paired
  rescued and newly killed; per game "Scary guy on level" notes with the monster, and flights from named monsters.
  Each value is reported as harmful, neutral (safe to adopt) or helpful (RULES 18). Direction only.
  Also per class: the highest CL reached, and whether any caster passes CL 8 (where the fragile end starts to act).
